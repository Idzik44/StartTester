MQL5/Experts/StartTester/StartTester11.mq5:
  role: 
  includes:
    StartTester/Zmienne11.mqh:
      provides:

    StartTester/CandleAndTransactionData11.mqh:
      provides:

    StartTester/PeaksEnded11.mqh:
      provides:

    StartTester/RangeAndVolumeAnalyzer11.mqh:
      provides:

    StartTester/PatternOptymalizer11.mqh:
      provides:

    StartTester/PatternDetector11.mqh:
      provides:

    StartTester/RegimeVisualizer.mqh:
      provides:

  globals:
    lastProcessedCandleTime:
      type: datetime
      owner: MQL5/Experts/StartTester/StartTester11.mq5
      origin:
        - "global"
      used_by:
        - "OnTick"
        - "OnDeinit"
      purpose: 
    closedCandleTime:
      type: datetime
      owner: MQL5/Experts/StartTester/StartTester11.mq5
      origin:
        - "global"
      used_by:
        - "OnTick"
      purpose: 
  functions:
    OnInit:
      signature: int OnInit()
      purpose: 
      calls:
        - "DumpZStats_Volume"
        - "DumpZStats_Range"
        - "ForceOptimizeParametersHistorical"
        - "RefreshCandleHistory"
        - "ResetSessionStats"
        - "ComputeCustomADX"
        - "AnalyzeInitialSessionRangesAndVolumes"
      reads:

      writes:

      file_scope: MQL5/Experts/StartTester/StartTester11.mq5
      entrypoint: true
    OnTick:
      signature: void OnTick()
      purpose: 
      calls:
        - "FilterPeaks"
        - "UpdateLiveSessionVolume"
        - "RefreshOrderAndPositionData"
        - "Peaks"
        - "Regime_Summary"
        - "DetectLivePatternAndDraw"
        - "CancelOldPendingOrders"
        - "RefreshCandleHistory"
        - "ApplyTrailingStop"
        - "MaybeOptimizeParametersHistorical"
        - "ComputeCustomADX"
        - "ApplyCandleBasedTrailingStop"
        - "ClosePositionsByRSI"
        - "Detector_StageAudit"
      reads:

      writes:
        - "lastProcessedCandleTime"
        - "closedCandleTime"
      file_scope: MQL5/Experts/StartTester/StartTester11.mq5
      entrypoint: true
    OnDeinit:
      signature: void OnDeinit(const int reason)
      purpose: 
      calls:

      reads:

      writes:
        - "lastProcessedCandleTime"
      file_scope: MQL5/Experts/StartTester/StartTester11.mq5
      entrypoint: true
